<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error 404 - Página no encontrada</title>
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at 50% 50%, #140d16 0%, #09050b 100%);
            --glass-bg: rgba(255, 255, 255, 0.02);
            --glass-border: rgba(255, 255, 255, 0.06);
            --error-color-1: #f43f5e; /* Rosa/Rojo Neón */
            --error-color-2: #8b5cf6; /* Violeta Eléctrico */
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Orbes de luz de fondo con tonos de advertencia */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(130px);
            opacity: 0.35;
            z-index: 1;
            animation: float 18s infinite alternate ease-in-out;
        }

        .orb-1 {
            width: 450px;
            height: 450px;
            background: var(--error-color-1);
            top: -5%;
            right: -10%;
        }

        .orb-2 {
            width: 450px;
            height: 450px;
            background: var(--error-color-2);
            bottom: -10%;
            left: -10%;
            animation-delay: -4s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(-40px, 50px) scale(1.15); }
        }

        /* Tarjeta de Error */
        .error-card {
            background: var(--glass-bg);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border);
            padding: 4rem 2.5rem;
            border-radius: 28px;
            width: 90%;
            max-width: 480px;
            text-align: center;
            z-index: 10;
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.7);
        }

        /* Código de Error Animado */
        .error-code {
            font-size: 7rem;
            font-weight: 900;
            line-height: 1;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #ffffff 20%, var(--error-color-1) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.05em;
            position: relative;
            display: inline-block;
            animation: pulseGlitch 4s infinite;
        }

        @keyframes pulseGlitch {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 0px transparent); }
            50% { transform: scale(1.02); filter: drop-shadow(0 0 15px rgba(244, 63, 94, 0.3)); }
        }

        /* Mensajes */
        h1 {
            color: var(--text-primary);
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 1rem;
            letter-spacing: -0.02em;
        }

        p {
            color: var(--text-secondary);
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 3rem;
        }

        /* Botón de Retorno Estilizado */
        .back-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            width: 100%;
            padding: 1.1rem 2rem;
            background: transparent;
            color: #ffffff;
            font-weight: 600;
            font-size: 1rem;
            text-decoration: none;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        .back-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
            transition: transform 0.3s ease;
        }

        .back-btn:hover {
            background: #ffffff;
            color: #09050b;
            border-color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(255, 255, 255, 0.15);
        }

        .back-btn:hover svg {
            transform: translateX(-4px);
        }

        /* Enlace sutil de soporte */
        .support-link {
            display: inline-block;
            margin-top: 2rem;
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.85rem;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .support-link:hover {
            color: var(--error-color-1);
        }
    </style>
</head>
<body>

    <!-- Luces ambientales de fondo -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <!-- Contenedor del Error -->
    <main class="error-card">
        
        <!-- Código del Estado -->
        <div class="error-code">404</div>

        <!-- Textos informativos -->
        <h1>Página no encontrada</h1>
        <p>El enlace que seguiste podría estar roto o la página ha sido eliminada permanentemente de nuestro sistema.</p>

        <!-- Botón de regreso con icono de flecha -->
        <a href="#" class="back-btn">
            <svg viewBox="0 0 24 24">
                <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
            </svg>
            Volver al inicio
        </a>

        <!-- Enlace secundario de ayuda técnica -->
        <a href="#" class="support-link">Notificar un problema técnico</a>

    </main>

</body>
</html>
